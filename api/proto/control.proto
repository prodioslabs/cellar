syntax = "proto3";

package cellar.v1;

option go_package = "github.com/prodioslabs/cellar/api/gen;cellarv1";

import "sandbox.proto";

// Control is served on the local unix socket only.
service Control {
  rpc Init(InitRequest) returns (InitResponse);
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc Leave(LeaveRequest) returns (LeaveResponse);
  rpc JoinToken(JoinTokenRequest) returns (JoinTokenResponse);
  rpc Status(StatusRequest) returns (StatusResponse);

  // Sandbox ops (forwarded to a manager / leader when needed).
  rpc SandboxCreate(SandboxCreateRequest) returns (SandboxCreateResponse);
  rpc SandboxStop(SandboxStopRequest) returns (SandboxStopResponse);
  rpc SandboxRemove(SandboxRemoveRequest) returns (SandboxRemoveResponse);
  rpc SandboxGet(SandboxGetRequest) returns (SandboxGetResponse);
  rpc SandboxUpdateNetwork(SandboxUpdateNetworkRequest) returns (SandboxUpdateNetworkResponse);
  rpc SandboxList(SandboxListRequest) returns (SandboxListResponse);
  rpc SandboxLogs(SandboxLogsRequest) returns (stream SandboxLogsChunk);
  rpc SandboxExec(stream SandboxExecMessage) returns (stream SandboxExecMessage);

  // API key management (local unix socket; writes require Raft leader).
  rpc APIKeyCreate(APIKeyCreateRequest) returns (APIKeyCreateResponse);
  rpc APIKeyList(APIKeyListRequest) returns (APIKeyListResponse);
  rpc APIKeyDelete(APIKeyDeleteRequest) returns (APIKeyDeleteResponse);

  // Cluster node management (reads on any manager; writes require Raft leader).
  rpc NodeList(NodeListRequest) returns (NodeListResponse);
  rpc NodeInspect(NodeInspectRequest) returns (NodeInspectResponse);
  rpc NodePromote(NodePromoteRequest) returns (NodePromoteResponse);
  rpc NodeDemote(NodeDemoteRequest) returns (NodeDemoteResponse);
  rpc NodeRemove(NodeRemoveRequest) returns (NodeRemoveResponse);
  rpc NodeUpdate(NodeUpdateRequest) returns (NodeUpdateResponse);
}

message InitRequest {
  string advertise_addr = 1; // host:port advertised to joiners (gRPC)
  string listen_addr = 2;    // local gRPC listen address
  string raft_addr = 3;      // raft TCP listen/advertise
  int64 cert_validity_ns = 4;
}

message InitResponse {
  string cluster_id = 1;
  string node_id = 2;
  string worker_token = 3;
  string manager_token = 4;
  string advertise_addr = 5;
}

message JoinRequest {
  string token = 1;
  string remote_addr = 2; // host:port of an existing manager
  string advertise_addr = 3;
  string listen_addr = 4;
  string raft_addr = 5;
}

message JoinResponse {
  string node_id = 1;
  string role = 2;
  string cluster_id = 3;
}

message JoinTokenRequest {
  string role = 1; // worker | manager
}

message JoinTokenResponse {
  string token = 1;
  string advertise_addr = 2;
  string join_command = 3;
}

message LeaveRequest {
  bool force = 1; // required for managers
}

message LeaveResponse {}

message StatusRequest {}

message StatusResponse {
  string node_id = 1;
  string role = 2;
  string cluster_id = 3;
  bool is_leader = 4;
  string advertise_addr = 5;
  bool initialized = 6;
  string listen_addr = 7;
  string raft_addr = 8;
}

message APIKeyCreateRequest {
  string name = 1;
}

message APIKeyCreateResponse {
  string id = 1;
  string name = 2;
  string key = 3;  // raw secret; shown once
  string mask = 4;
  int64 created_at_unix_nano = 5;
}

message APIKeyListRequest {}

message APIKeyInfo {
  string id = 1;
  string name = 2;
  string mask = 3;
  int64 created_at_unix_nano = 4;
  int64 last_used_unix_nano = 5;
  bool disabled = 6;
}

message APIKeyListResponse {
  repeated APIKeyInfo keys = 1;
}

message APIKeyDeleteRequest {
  string id = 1;
}

message APIKeyDeleteResponse {}

// NodeInfo is the Control-plane view of a cluster node (not the CA NodeRecord).
message NodeInfo {
  string node_id = 1;
  string role = 2;                // worker | manager
  string membership = 3;          // accepted | pending
  string availability = 4;        // active | pause | drain
  map<string, string> labels = 5;
  string status = 6;              // ready | down (from heartbeat)
  string manager_status = 7;      // leader | reachable | "" for workers
  string runtime_grpc_addr = 8;
  int64 runtime_heartbeat_unix_nano = 9;
  int32 runtime_sandbox_count = 10;
  string pub_key_fingerprint = 11;
  int64 issued_at_unix_nano = 12;
  int64 expires_at_unix_nano = 13;
}

message NodeListRequest {}

message NodeListResponse {
  repeated NodeInfo nodes = 1;
}

message NodeInspectRequest {
  string node_id = 1;
}

message NodeInspectResponse {
  NodeInfo node = 1;
}

message NodePromoteRequest {
  string node_id = 1;
}

message NodePromoteResponse {}

message NodeDemoteRequest {
  string node_id = 1;
}

message NodeDemoteResponse {}

message NodeRemoveRequest {
  string node_id = 1;
  bool force = 2; // required when the node has a fresh heartbeat
}

message NodeRemoveResponse {}

message NodeUpdateRequest {
  string node_id = 1;
  string availability = 2;              // empty = unchanged; else active|pause|drain
  map<string, string> label_add = 3;    // merge into labels
  repeated string label_rm = 4;         // keys to delete
  string role = 5;                      // empty = unchanged; else worker|manager (promote/demote)
}

message NodeUpdateResponse {
  NodeInfo node = 1;
}
