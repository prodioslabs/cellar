syntax = "proto3";

package cellar.agent.v1;

option go_package = "github.com/prodioslabs/cellar/api/gen/agent;agentv1";

// SandboxAgent runs inside each sandbox as PID 1 (cellar-agent).
service SandboxAgent {
  // Liveness for host readiness after create.
  rpc Health(HealthRequest) returns (HealthResponse);

  // Bidirectional command session (mirrors SandboxRuntime.Exec semantics).
  rpc RunCommand(stream RunCommandMessage) returns (stream RunCommandMessage);
}

message HealthRequest {}

message HealthResponse {
  string sandbox_id = 1;
  string version = 2;
}

message RunCommandMessage {
  oneof payload {
    RunCommandStart start = 1;
    bytes stdin = 2;
    bytes stdout = 3;
    bytes stderr = 4;
    RunCommandExit exit = 5;
    bool stdin_closed = 6;
  }
}

message RunCommandStart {
  repeated string command = 1;
  bool tty = 2;
  bool stdin = 3;
  string cwd = 4;
  repeated string env = 5; // KEY=VALUE overlays
}

message RunCommandExit {
  int32 exit_code = 1;
  string error = 2;
}
