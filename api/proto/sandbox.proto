syntax = "proto3";

package cellar.v1;

option go_package = "github.com/prodioslabs/cellar/api/gen;cellarv1";

// SandboxControl is served on managers (mTLS). Leader applies Raft writes.
service SandboxControl {
  rpc Create(SandboxCreateRequest) returns (SandboxCreateResponse);
  rpc Start(SandboxStartRequest) returns (SandboxStartResponse);
  rpc Stop(SandboxStopRequest) returns (SandboxStopResponse);
  rpc Remove(SandboxRemoveRequest) returns (SandboxRemoveResponse);
  rpc Get(SandboxGetRequest) returns (SandboxGetResponse);
  rpc GetByName(SandboxGetByNameRequest) returns (SandboxGetResponse);
  rpc List(SandboxListRequest) returns (SandboxListResponse);

  rpc CreateVolume(VolumeCreateRequest) returns (VolumeCreateResponse);
  rpc ListVolumes(VolumeListRequest) returns (VolumeListResponse);
  rpc GetVolume(VolumeGetRequest) returns (VolumeGetResponse);
  rpc GetDefaultVolume(VolumeGetDefaultRequest) returns (VolumeGetResponse);
  rpc DeleteVolume(VolumeDeleteRequest) returns (VolumeDeleteResponse);
}

// SandboxAPI is the public client API on managers (API key auth).
service SandboxAPI {
  rpc Create(SandboxCreateRequest) returns (SandboxCreateResponse);
  rpc Start(SandboxStartRequest) returns (SandboxStartResponse);
  rpc Stop(SandboxStopRequest) returns (SandboxStopResponse);
  rpc Remove(SandboxRemoveRequest) returns (SandboxRemoveResponse);
  rpc Get(SandboxGetRequest) returns (SandboxGetResponse);
  rpc GetByName(SandboxGetByNameRequest) returns (SandboxGetResponse);
  rpc List(SandboxListRequest) returns (SandboxListResponse);
  rpc Logs(SandboxLogsRequest) returns (stream SandboxLogsChunk);

  rpc CreateVolume(VolumeCreateRequest) returns (VolumeCreateResponse);
  rpc ListVolumes(VolumeListRequest) returns (VolumeListResponse);
  rpc GetVolume(VolumeGetRequest) returns (VolumeGetResponse);
  rpc GetDefaultVolume(VolumeGetDefaultRequest) returns (VolumeGetResponse);
  rpc DeleteVolume(VolumeDeleteRequest) returns (VolumeDeleteResponse);
}

// RuntimeAgent is served on managers. Nodes report heartbeats and status.
service RuntimeAgent {
  rpc Heartbeat(RuntimeHeartbeatRequest) returns (RuntimeHeartbeatResponse);
  rpc UpdateSandboxStatus(UpdateSandboxStatusRequest) returns (UpdateSandboxStatusResponse);
  rpc ListNodeSandboxes(ListNodeSandboxesRequest) returns (ListNodeSandboxesResponse);
}

// SandboxRuntime is served on every node for logs/agent relay/volume FS.
service SandboxRuntime {
  rpc Logs(SandboxLogsRequest) returns (stream SandboxLogsChunk);
  rpc AgentRelay(stream AgentRelayChunk) returns (stream AgentRelayChunk);

  rpc VolumeFsRead(VolumeFsReadRequest) returns (stream FsChunk);
  rpc VolumeFsWrite(stream VolumeFsWriteMessage) returns (VolumeFsWriteResponse);
  rpc VolumeFsStat(VolumeFsStatRequest) returns (VolumeFsStatResponse);
  rpc VolumeFsList(VolumeFsListRequest) returns (VolumeFsListResponse);
  rpc VolumeFsExists(VolumeFsExistsRequest) returns (VolumeFsExistsResponse);
  rpc VolumeFsMkdir(VolumeFsMkdirRequest) returns (VolumeFsMkdirResponse);
  rpc VolumeFsRemove(VolumeFsRemoveRequest) returns (VolumeFsRemoveResponse);
  rpc VolumeFsCopy(VolumeFsCopyRequest) returns (VolumeFsCopyResponse);
  rpc VolumeFsRename(VolumeFsRenameRequest) returns (VolumeFsRenameResponse);

  rpc EnsureLocalVolume(EnsureLocalVolumeRequest) returns (EnsureLocalVolumeResponse);
  rpc DeleteLocalVolume(DeleteLocalVolumeRequest) returns (DeleteLocalVolumeResponse);
}

// SpecJSON carries the msb-cloud Spec as JSON bytes (snake_case wire).
message SandboxCreateRequest {
  bytes spec_json = 1;
  string sandbox_id = 2; // optional; generated if empty
  bool start = 3;
}

message SandboxCreateResponse {
  Sandbox sandbox = 1;
}

message SandboxStartRequest {
  string sandbox_id = 1;
}

message SandboxStartResponse {
  Sandbox sandbox = 1;
}

message SandboxStopRequest {
  string sandbox_id = 1;
}

message SandboxStopResponse {
  Sandbox sandbox = 1;
}

message SandboxRemoveRequest {
  string sandbox_id = 1;
}

message SandboxRemoveResponse {}

message SandboxGetRequest {
  string sandbox_id = 1;
}

message SandboxGetByNameRequest {
  string name = 1;
}

message SandboxGetResponse {
  Sandbox sandbox = 1;
}

message SandboxListRequest {
  string cursor = 1;
  uint32 limit = 2;
  string labels_json = 3; // optional JSON object filter
}

message SandboxListResponse {
  repeated Sandbox sandboxes = 1;
  string next_cursor = 2;
}

// Sandbox is the control-plane object. Spec is opaque JSON matching cloud Spec.
message Sandbox {
  string id = 1;
  string name = 2;
  string slug = 3;
  bytes spec_json = 4;
  string node_id = 5;
  string desired_state = 6;
  SandboxStatus status = 7;
  bool ephemeral = 8;
  bytes labels_json = 9;
  int64 created_at_unix_nano = 10;
  int64 updated_at_unix_nano = 11;
  int64 assignment_generation = 12;
}

message SandboxStatus {
  string phase = 1;
  string local_name = 2;
  string message = 3;
  int64 started_at_unix_nano = 4;
  int64 stopped_at_unix_nano = 5;
  int64 updated_at_unix_nano = 6;
}

message RuntimeHeartbeatRequest {
  string node_id = 1;
  string grpc_addr = 2;
  int32 sandbox_count = 3;
}

message RuntimeHeartbeatResponse {
  repeated Sandbox assigned = 1;
  string desired_role = 2;
  bool removed = 3;
  string leader_grpc = 4;
  repeated string manager_addrs = 5;
}

message UpdateSandboxStatusRequest {
  string sandbox_id = 1;
  SandboxStatus status = 2;
  int64 assignment_generation = 3;
}

message UpdateSandboxStatusResponse {}

message ListNodeSandboxesRequest {
  string node_id = 1;
}

message ListNodeSandboxesResponse {
  repeated Sandbox sandboxes = 1;
}

message SandboxLogsRequest {
  string sandbox_id = 1;
  bool follow = 2;
  string sources = 3; // comma-separated: stdout,stderr,system,output
  string last_event_id = 4;
}

message SandboxLogsChunk {
  string id = 1;
  string source = 2;
  int64 ts_unix_nano = 3;
  string text = 4;
}

message AgentRelayChunk {
  bytes data = 1;
}

message Volume {
  string id = 1;
  string name = 2;
  string kind = 3;
  string status = 4;
  string node_id = 5;
  optional uint64 used_bytes = 6;
  optional uint64 capacity_bytes = 7;
  optional uint32 capacity_gib = 8;
  bytes labels_json = 9;
  int64 created_at_unix_nano = 10;
  int64 updated_at_unix_nano = 11;
}

message VolumeCreateRequest {
  string name = 1;
  optional uint32 capacity_gib = 2;
  bytes labels_json = 3;
}

message VolumeCreateResponse {
  Volume volume = 1;
}

message VolumeListRequest {}

message VolumeListResponse {
  repeated Volume volumes = 1;
}

message VolumeGetRequest {
  string volume_id = 1;
}

message VolumeGetDefaultRequest {}

message VolumeGetResponse {
  Volume volume = 1;
}

message VolumeDeleteRequest {
  string volume_id = 1;
}

message VolumeDeleteResponse {
  string message = 1;
}

message FsChunk {
  bytes data = 1;
}

message FsMetadata {
  string kind = 1;
  int64 size = 2;
  uint32 mode = 3;
  bool readonly = 4;
  uint32 uid = 5;
  uint32 gid = 6;
  int64 modified_unix_nano = 7;
  int64 created_unix_nano = 8;
  string path = 9;
}

message FsEntry {
  string path = 1;
  string kind = 2;
  int64 size = 3;
  uint32 mode = 4;
  int64 modified_unix_nano = 5;
}

message VolumeFsReadRequest {
  string volume_id = 1;
  string path = 2;
}

message VolumeFsWriteStart {
  string volume_id = 1;
  string path = 2;
}

message VolumeFsWriteMessage {
  oneof payload {
    VolumeFsWriteStart start = 1;
    bytes data = 2;
  }
}

message VolumeFsWriteResponse {}

message VolumeFsStatRequest {
  string volume_id = 1;
  string path = 2;
}

message VolumeFsStatResponse {
  FsMetadata metadata = 1;
}

message VolumeFsListRequest {
  string volume_id = 1;
  string path = 2;
}

message VolumeFsListResponse {
  repeated FsEntry entries = 1;
}

message VolumeFsExistsRequest {
  string volume_id = 1;
  string path = 2;
}

message VolumeFsExistsResponse {
  bool exists = 1;
}

message VolumeFsMkdirRequest {
  string volume_id = 1;
  string path = 2;
}

message VolumeFsMkdirResponse {}

message VolumeFsRemoveRequest {
  string volume_id = 1;
  string path = 2;
  bool recursive = 3;
}

message VolumeFsRemoveResponse {}

message VolumeFsCopyRequest {
  string volume_id = 1;
  string from = 2;
  string to = 3;
}

message VolumeFsCopyResponse {}

message VolumeFsRenameRequest {
  string volume_id = 1;
  string from = 2;
  string to = 3;
}

message VolumeFsRenameResponse {}

message EnsureLocalVolumeRequest {
  string volume_id = 1;
  string name = 2;
  optional uint32 capacity_gib = 3;
}

message EnsureLocalVolumeResponse {}

message DeleteLocalVolumeRequest {
  string volume_id = 1;
  string name = 2;
}

message DeleteLocalVolumeResponse {}
