syntax = "proto3";

package cellar.v1;

option go_package = "github.com/prodioslabs/cellar/api/gen;cellarv1";

// SandboxControl is served on managers (mTLS). Leader applies Raft writes.
// Callers must present a cluster client certificate.
service SandboxControl {
  rpc Create(SandboxCreateRequest) returns (SandboxCreateResponse);
  rpc Stop(SandboxStopRequest) returns (SandboxStopResponse);
  rpc Remove(SandboxRemoveRequest) returns (SandboxRemoveResponse);
  rpc Get(SandboxGetRequest) returns (SandboxGetResponse);
  rpc List(SandboxListRequest) returns (SandboxListResponse);
  rpc UpdateNetwork(SandboxUpdateNetworkRequest) returns (SandboxUpdateNetworkResponse);
}

// SandboxAPI is the public client API on managers. Authenticate with an API key
// (authorization: Bearer cellar_… or x-api-key metadata). Non-leader managers
// forward mutating RPCs to the Raft leader. Exec/Logs are proxied to the owning node.
service SandboxAPI {
  rpc Create(SandboxCreateRequest) returns (SandboxCreateResponse);
  rpc Stop(SandboxStopRequest) returns (SandboxStopResponse);
  rpc Remove(SandboxRemoveRequest) returns (SandboxRemoveResponse);
  rpc Get(SandboxGetRequest) returns (SandboxGetResponse);
  rpc List(SandboxListRequest) returns (SandboxListResponse);
  rpc UpdateNetwork(SandboxUpdateNetworkRequest) returns (SandboxUpdateNetworkResponse);
  rpc Logs(SandboxLogsRequest) returns (stream SandboxLogsChunk);
  rpc Exec(stream SandboxExecMessage) returns (stream SandboxExecMessage);
  rpc StartJob(StartJobRequest) returns (StartJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc StopJob(StopJobRequest) returns (StopJobResponse);
  rpc JobLogs(JobLogsRequest) returns (stream SandboxLogsChunk);
}

// RuntimeAgent is served on managers. Nodes report heartbeats and status.
service RuntimeAgent {
  rpc Heartbeat(RuntimeHeartbeatRequest) returns (RuntimeHeartbeatResponse);
  rpc UpdateSandboxStatus(UpdateSandboxStatusRequest) returns (UpdateSandboxStatusResponse);
  rpc ListNodeSandboxes(ListNodeSandboxesRequest) returns (ListNodeSandboxesResponse);
}

// SandboxRuntime is served on every node for logs/exec against local containers.
service SandboxRuntime {
  rpc Logs(SandboxLogsRequest) returns (stream SandboxLogsChunk);
  rpc Exec(stream SandboxExecMessage) returns (stream SandboxExecMessage);
  // Applies a committed network policy to a running sandbox immediately,
  // instead of waiting for the next reconcile tick.
  rpc ApplyNetworkPolicy(ApplyNetworkPolicyRequest) returns (ApplyNetworkPolicyResponse);
  rpc StartJob(StartJobRequest) returns (StartJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc StopJob(StopJobRequest) returns (StopJobResponse);
  rpc JobLogs(JobLogsRequest) returns (stream SandboxLogsChunk);
}

message Mount {
  string source = 1;
  string target = 2;
  bool read_only = 3;
}

message Resources {
  int64 cpu_nano_cores = 1;
  int64 memory_bytes = 2;
}

message NetworkRule {
  repeated string hosts = 1;
  repeated uint32 ports = 2;
  repeated string protocols = 3;
}

message DNSPolicy {
  string mode = 1; // none | allowlist | denylist
  repeated string names = 2;
}

message NetworkPolicy {
  string mode = 1; // none | allowlist | denylist | blockall
  DNSPolicy dns = 2;
  repeated NetworkRule rules = 3;
  // Daytona-style sugar (translated to mode/rules server-side; not stored).
  // At most one of network_allow_list, domain_allow_list, or block_all may be
  // set, and none may combine with structured mode/rules/dns. Empty strings
  // count as unset.
  string network_allow_list = 4; // comma-separated IPv4 CIDRs, max 10
  string domain_allow_list = 5;  // comma-separated domains / *.wildcards, max 20
  optional bool block_all = 6;   // true = blockall; false alone = denylist (full open)
  bool essential_services = 7;   // opt-in curated package/git/AI allowlist
}

message SandboxSpec {
  string image = 1; // custom image; XOR with runtime
  repeated string command = 2;
  repeated string args = 3;
  repeated string env = 4;
  string working_dir = 5;
  repeated Mount mounts = 6;
  Resources resources = 7;
  NetworkPolicy network = 8;
  string runtime = 9; // language preset (node-26, bun-1.3, python-3.13, go-1.26)
}

message SandboxStatus {
  string phase = 1;
  string container_id = 2;
  int32 exit_code = 3;
  string message = 4;
  int64 started_at_unix_nano = 5;
  int64 finished_at_unix_nano = 6;
  int64 updated_at_unix_nano = 7;
}

message Sandbox {
  string id = 1;
  SandboxSpec spec = 2;
  string node_id = 3;
  string desired_state = 4;
  SandboxStatus status = 5;
  int64 created_at_unix_nano = 6;
  int64 updated_at_unix_nano = 7;
}

message SandboxCreateRequest {
  SandboxSpec spec = 1;
  string sandbox_id = 2; // optional; generated if empty
}

message SandboxCreateResponse {
  Sandbox sandbox = 1;
}

message SandboxStopRequest {
  string sandbox_id = 1;
}

message SandboxStopResponse {
  Sandbox sandbox = 1;
}

message SandboxRemoveRequest {
  string sandbox_id = 1;
}

message SandboxRemoveResponse {}

message SandboxGetRequest {
  string sandbox_id = 1;
}

message SandboxGetResponse {
  Sandbox sandbox = 1;
}

message SandboxUpdateNetworkRequest {
  string sandbox_id = 1;
  NetworkPolicy network = 2;
}

message SandboxUpdateNetworkResponse {
  Sandbox sandbox = 1;
}

message ApplyNetworkPolicyRequest {
  string sandbox_id = 1;
  NetworkPolicy network = 2;
}

message ApplyNetworkPolicyResponse {}

message SandboxListRequest {}

message SandboxListResponse {
  repeated Sandbox sandboxes = 1;
}

message RuntimeHeartbeatRequest {
  string node_id = 1;
  string grpc_addr = 2;
  int32 sandbox_count = 3;
}

message RuntimeHeartbeatResponse {
  repeated Sandbox assigned = 1; // sandboxes currently assigned to this node
  string desired_role = 2;       // store role; node applies promote/demote when mismatched
  bool removed = 3;              // node record deleted from cluster; wipe local identity
  string leader_grpc = 4;        // current Raft leader gRPC address
  repeated string manager_addrs = 5; // known manager gRPC addresses for failover
}

message UpdateSandboxStatusRequest {
  string sandbox_id = 1;
  SandboxStatus status = 2;
  string container_id = 3;
}

message UpdateSandboxStatusResponse {}

message ListNodeSandboxesRequest {
  string node_id = 1;
}

message ListNodeSandboxesResponse {
  repeated Sandbox sandboxes = 1;
}

message SandboxLogsRequest {
  string sandbox_id = 1;
  bool follow = 2;
  int64 tail = 3; // lines; 0 = all
  bool timestamps = 4;
}

message SandboxLogsChunk {
  bytes data = 1;
}

// Bidirectional exec: first client message must set start; then stdin chunks.
// Server sends stdout/stderr/exit.
message SandboxExecMessage {
  oneof payload {
    SandboxExecStart start = 1;
    bytes stdin = 2;
    bytes stdout = 3;
    bytes stderr = 4;
    SandboxExecExit exit = 5;
    bool stdin_closed = 6;
  }
}

message SandboxExecStart {
  string sandbox_id = 1;
  repeated string command = 2;
  bool tty = 3;
  bool stdin = 4;
}

message SandboxExecExit {
  int32 exit_code = 1;
  string error = 2;
}

message StartJobRequest {
  string sandbox_id = 1;
  repeated string command = 2;
}

message StartJobResponse {
  string job_id = 1;
}

message ListJobsRequest {
  string sandbox_id = 1;
}

message JobInfo {
  string id = 1;
  repeated string command = 2;
  string phase = 3; // running | exited | unknown
  int32 exit_code = 4;
  int64 started_at_unix_nano = 5;
}

message ListJobsResponse {
  repeated JobInfo jobs = 1;
}

message GetJobRequest {
  string sandbox_id = 1;
  string job_id = 2;
}

message GetJobResponse {
  JobInfo job = 1;
}

message StopJobRequest {
  string sandbox_id = 1;
  string job_id = 2;
  int32 timeout_sec = 3;
}

message StopJobResponse {}

message JobLogsRequest {
  string sandbox_id = 1;
  string job_id = 2;
  bool follow = 3;
}
