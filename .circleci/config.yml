version: 2.1

orbs:
  go: circleci/go@4.0.0

executors:
  linux-go:
    docker:
      - image: cimg/go:1.26
    environment:
      GOTOOLCHAIN: auto

  linux-goreleaser-cross:
    docker:
      - image: goreleaser/goreleaser-cross:v1.26
        # Image ENTRYPOINT execs goreleaser; CircleCI run steps need a shell.
        entrypoint: ["/bin/bash"]
    environment:
      GOTOOLCHAIN: auto
      CGO_ENABLED: "1"

commands:
  checkout-full:
    description: 'Checkout with full git history (GitHub fetch-depth: 0)'
    steps:
      - checkout
      - run:
          name: Fetch full git history and tags
          command: |
            git config --global --add safe.directory "$(pwd)"
            if git rev-parse --is-shallow-repository | grep -q true; then
              git fetch --unshallow --tags --force
            else
              git fetch --tags --force
            fi

jobs:
  test:
    executor: linux-go
    steps:
      - checkout
      - go/mod-download-cached
      - run:
          name: Test
          command: go test ./...

  snapshot:
    executor: linux-goreleaser-cross
    resource_class: large
    steps:
      - checkout-full
      - go/mod-download-cached
      - run:
          name: Check GoReleaser config
          command: goreleaser check
      - run:
          name: Snapshot release
          command: goreleaser release --snapshot --clean

  release:
    executor: linux-goreleaser-cross
    resource_class: large
    steps:
      - checkout-full
      - run:
          name: Validate tag
          command: |
            tag="${CIRCLE_TAG}"
            if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
              echo "Invalid release tag: $tag"
              echo "Expected SemVer like v1.2.3 or v1.2.3-rc.1"
              exit 1
            fi
      - go/mod-download-cached
      - run:
          name: Test
          command: go test ./...
      - run:
          name: Check GoReleaser config
          command: goreleaser check
      - run:
          name: Release
          command: goreleaser release --clean

workflows:
  ci:
    jobs:
      - test:
          filters:
            tags:
              ignore: /.*/
      - snapshot:
          requires:
            - test
          filters:
            tags:
              ignore: /.*/

  release:
    jobs:
      - release:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$/
