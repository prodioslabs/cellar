name: Release

# Temporarily disabled — restore tag push trigger to re-enable.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid release tag: $tag"
            echo "Expected SemVer like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build egress-gateway image archives
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          mkdir -p release-extras
          # Sequential: shared :latest / :$tag names must not overwrite the
          # other arch before docker save finishes.
          for arch in amd64 arm64; do
            make egress-gateway-image-tarball \
              VERSION="$tag" \
              EGRESS_IMAGE_ARCH="$arch" \
              EGRESS_TARBALL="release-extras/cellar-egress-gateway-image_${version}_linux_${arch}.tar.gz"
          done

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
