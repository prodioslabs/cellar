# Allowlisted egress for HTTPS to example.com.
# cellar-agent is injected as PID 1; use `cellar sandbox exec` to run commands.
# Usage: cellar sandbox create -f examples/sandbox-allowlist.yaml
id: demo-curl
image: curlimages/curl
network:
  mode: allowlist
  allow_hosts:
    - example.com
  allow_ports:
    - 443
